# InfisicalStaticSecrets syncing /actions-runners/* from Infisical (agentrunner-s-qn-8, prod).
# Expected keys per Infisical folder:
#   /actions-runners/arc-github-auth     -> github_app_id, github_app_installation_id, github_app_private_key
#   /actions-runners/review-bot-app-key  -> github_app_id, github_app_installation_id, private-key.pem
#   /actions-runners/release-bot-app     -> github_app_id, github_app_installation_id, private-key.pem
#   /actions-runners/author-bot-app      -> github_app_id, github_app_installation_id, private-key.pem
#   /actions-runners/agent-gateway-token -> token, envoy_extproc_sdk_go, github_agent_runner
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: arc-github-auth
  namespace: actions-runners
spec:
  infisicalAuthRef:
    name: infisical-universal-auth
    namespace: infisical-operator-system
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: "6f51f69d-3bdb-46cf-af78-6e095c3502b1"
      environmentSlug: "prod"
      secretPath: "/actions-runners/arc-github-auth"
  targets:
    - name: arc-github-auth
      namespace: actions-runners
      kind: Secret
      creationPolicy: Owner
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: review-bot-app-key
  namespace: actions-runners
spec:
  infisicalAuthRef:
    name: infisical-universal-auth
    namespace: infisical-operator-system
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: "6f51f69d-3bdb-46cf-af78-6e095c3502b1"
      environmentSlug: "prod"
      secretPath: "/actions-runners/review-bot-app-key"
  targets:
    - name: review-bot-app-key
      namespace: actions-runners
      kind: Secret
      creationPolicy: Owner
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: agent-gateway-token
  namespace: actions-runners
spec:
  infisicalAuthRef:
    name: infisical-universal-auth
    namespace: infisical-operator-system
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: "6f51f69d-3bdb-46cf-af78-6e095c3502b1"
      environmentSlug: "prod"
      secretPath: "/actions-runners/agent-gateway-token"
  targets:
    - name: agent-gateway-token
      namespace: actions-runners
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          token: "{{ .token.Value }}"
    - name: agent-gateway-token-envoy-extproc-sdk-go
      namespace: actions-runners
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          token: "{{ .envoy_extproc_sdk_go.Value }}"
    - name: agent-gateway-token-github-agent-runner
      namespace: actions-runners
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          token: "{{ .github_agent_runner.Value }}"
---
apiVersion: secrets.infisical.com/v1beta1
