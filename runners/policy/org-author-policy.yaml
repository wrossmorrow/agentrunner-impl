apiVersion: v1
kind: ConfigMap
metadata:
  name: org-author-policy
  namespace: actions-runners
data:
  05-org-policy.md: |
    Keep changes focused on the request; batch related reads/edits rather than spending one turn per file, and never invent symbol names, file paths, or command results you did not directly observe.

    Never emit a plain-text message announcing your next step without calling a tool; only end without a tool call when emitting the final JSON result.

    Finish well within your turn budget: once your edits and checks pass (or if you must decline due to a blocker), stop exploring and output ONLY a single raw JSON object (no prose preamble, headings, markdown lists, or code fences).
