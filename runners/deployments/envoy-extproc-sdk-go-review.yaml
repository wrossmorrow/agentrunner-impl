apiVersion: agentic.example.io/v1alpha1
kind: AgenticRunnerDeployment
metadata:
  name: envoy-extproc-sdk-go-review
  namespace: actions-runners
spec:
  runner:
    githubConfigUrl: https://github.com/wrossmorrow/envoy-extproc-sdk-go
    githubConfigSecret: arc-github-auth
    runnerScaleSetName: envoy-extproc-sdk-go-review
    minRunners: 0
    maxRunners: 2
  toolchainRef:
    name: go-1.26
  agent:
    harness: pi
    model: RecursiveSI/flint
    gateway:
      endpoint: http://agent-router.ai-gateway.svc.cluster.local:8080/v1
      authSecretRef:
        name: agent-gateway-token-envoy-extproc-sdk-go
    limits:
      maxTurns: 25
      maxDuration: 10m
      maxCostUsd: 2.00
      contextWindow: 131072
      maxTokens: 16384
      maxTransportRetries: 2
    systemPromptRef:
      configMapName: org-review-policy
    githubAppSecretRef:
      name: review-bot-app-key
    sessionSink:
      endpoint: http://session-hub.session-system.svc.cluster.local:8787/internal/archive
      authSecretRef:
        name: session-sink-token
        key: token
