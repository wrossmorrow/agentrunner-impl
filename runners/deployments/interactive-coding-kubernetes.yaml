apiVersion: agentic.example.io/v1alpha1
kind: AgenticRunnerDeployment
metadata:
  name: interactive-coding-kubernetes-review
  namespace: actions-runners
spec:
  runner:
    githubConfigUrl: https://github.com/wrossmorrow/interactive-coding-kubernetes
    githubConfigSecret: arc-github-auth
    runnerScaleSetName: interactive-coding-kubernetes-review
    minRunners: 0
    maxRunners: 2
  toolchainRef:
    name: go-1.26
  agent:
    harness: pi
    model: thinkingmachines/Inkling-2-Mini
    gateway:
      endpoint: http://agent-router.ai-gateway.svc.cluster.local:8080/v1
      authSecretRef:
        name: agent-gateway-token-interactive-coding-kubernetes
    limits:
      maxTurns: 100
      maxDuration: 10m
      maxCostUsd: 2.00
      contextWindow: 131072
      maxTokens: 16384
      maxTransportRetries: 2
    systemPromptRef:
      configMapName: org-review-policy
    githubAppSecretRef:
      name: review-bot-app-key
    sessionSink:
      endpoint: http://session-hub.session-system.svc.cluster.local:8787/internal/archive
      authSecretRef:
        name: session-sink-token
        key: token
---
apiVersion: agentic.example.io/v1alpha1
kind: AgenticRunnerDeployment
metadata:
