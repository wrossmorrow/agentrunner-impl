  namespace: actions-runners
spec:
  runner:
    githubConfigUrl: https://github.com/wrossmorrow/interactive-coding-kubernetes
    githubConfigSecret: arc-github-auth
    runnerScaleSetName: interactive-coding-kubernetes-release
    minRunners: 0
    maxRunners: 1
  toolchainRef:
    name: go-1.26
  agent:
    harness: pi
    mode: read-only
    model: thinkingmachines/Inkling-2-Mini
    gateway:
      endpoint: http://agent-router.ai-gateway.svc.cluster.local:8080/v1
      authSecretRef:
        name: agent-gateway-token-interactive-coding-kubernetes
    limits:
