[project]
name = "agentreview-modal"
version = "0.1.0"
description = "Serverless Modal deployment for RecursiveSI/flint"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.0.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
