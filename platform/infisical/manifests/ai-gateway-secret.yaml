# Syncs FLINT_API_KEY and INKLING_API_KEY from /ai-gateway in Infisical (project slug: agentrunner-s-qn-8)
# into ai-gateway/{flint,inkling}-modal-api-key under the "apiKey" key expected by Envoy AI Gateway.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: ai-gateway-secrets
  namespace: ai-gateway
spec:
  infisicalAuthRef:
    name: infisical-universal-auth
    namespace: infisical-operator-system
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: "6f51f69d-3bdb-46cf-af78-6e095c3502b1"
      environmentSlug: "prod"
      secretPath: "/ai-gateway"
  targets:
    - name: flint-modal-api-key
      namespace: ai-gateway
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          apiKey: "{{ .FLINT_API_KEY.Value }}"
    - name: inkling-modal-api-key
      namespace: ai-gateway
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          apiKey: "{{ .INKLING_API_KEY.Value }}"
---
# Syncs the inbound runner token from /actions-runners/agent-gateway-token into
# ai-gateway/agent-router-clients so Envoy Gateway SecurityPolicy can authenticate callers.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: agent-router-clients
  namespace: ai-gateway
spec:
  infisicalAuthRef:
    name: infisical-universal-auth
    namespace: infisical-operator-system
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: "6f51f69d-3bdb-46cf-af78-6e095c3502b1"
      environmentSlug: "prod"
      secretPath: "/actions-runners/agent-gateway-token"
  targets:
    - name: agent-router-clients
      namespace: ai-gateway
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          go-reviewer: "{{ .token.Value }}"
          envoy-extproc-sdk-go: "{{ .envoy_extproc_sdk_go.Value }}"
          github-agent-runner: "{{ .github_agent_runner.Value }}"
          interactive-sessions: "{{ .interactive_sessions.Value }}"
---
# Syncs QWEN_API_KEY from /ai-gateway in Infisical into ai-gateway/qwen-modal-api-key.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: qwen-modal-api-key
  namespace: ai-gateway
spec:
  infisicalAuthRef:
    name: infisical-universal-auth
    namespace: infisical-operator-system
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: "6f51f69d-3bdb-46cf-af78-6e095c3502b1"
      environmentSlug: "prod"
      secretPath: "/ai-gateway"
  targets:
    - name: qwen-modal-api-key
      namespace: ai-gateway
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          apiKey: "{{ .QWEN_API_KEY.Value }}"
