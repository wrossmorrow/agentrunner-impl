# Syncs MOTHERDUCK_TOKEN from /usage-sink in Infisical (agentrunner-s-qn-8, prod)
# into ai-gateway/usage-sink-motherduck for the Envoy ALS usage-sink Deployment.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: usage-sink-motherduck
  namespace: ai-gateway
spec:
  infisicalAuthRef:
    name: infisical-universal-auth
    namespace: infisical-operator-system
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: "6f51f69d-3bdb-46cf-af78-6e095c3502b1"
      environmentSlug: "prod"
      secretPath: "/usage-sink"
  targets:
    - name: usage-sink-motherduck
      namespace: ai-gateway
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          MOTHERDUCK_TOKEN: "{{ .MOTHERDUCK_TOKEN.Value }}"
