# Syncs interactive_sessions from /actions-runners/agent-gateway-token into
# interactive-sessions/agent-gateway-token (key: token) for interactive sandbox pods.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: agent-gateway-token
  namespace: interactive-sessions
spec:
  infisicalAuthRef:
    name: infisical-universal-auth
    namespace: infisical-operator-system
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: "6f51f69d-3bdb-46cf-af78-6e095c3502b1"
      environmentSlug: "prod"
      secretPath: "/actions-runners/agent-gateway-token"
  targets:
    - name: agent-gateway-token
      namespace: interactive-sessions
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          token: "{{ .interactive_sessions.Value }}"
---
# Syncs private-key.pem from /interactive-github-app into
# interactive-sessions/interactive-github-app for the github-auth sidecar.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: interactive-github-app
  namespace: interactive-sessions
spec:
  infisicalAuthRef:
    name: infisical-universal-auth
    namespace: infisical-operator-system
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: "6f51f69d-3bdb-46cf-af78-6e095c3502b1"
      environmentSlug: "prod"
      secretPath: "/interactive-github-app"
  targets:
    - name: interactive-github-app
      namespace: interactive-sessions
      kind: Secret
      creationPolicy: Owner
---
# Syncs private-key.pem from /interactive-github-app into
# session-system/interactive-github-app for session-hub's PR review wakeup poller.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: interactive-github-app
  namespace: session-system
spec:
  infisicalAuthRef:
    name: infisical-universal-auth
    namespace: infisical-operator-system
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: "6f51f69d-3bdb-46cf-af78-6e095c3502b1"
      environmentSlug: "prod"
      secretPath: "/interactive-github-app"
  targets:
    - name: interactive-github-app
      namespace: session-system
      kind: Secret
      creationPolicy: Owner
