apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: agent-router-routes
  namespace: ai-gateway
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agent-router
  llmRequestCosts:
    - metadataKey: llm_input_token
      type: InputToken
    - metadataKey: llm_output_token
      type: OutputToken
    - metadataKey: llm_total_token
      type: TotalToken
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: RecursiveSI/flint
      timeouts:
        request: 180s
        backendRequest: 180s
      backendRefs:
        - name: flint-modal
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: thinkingmachines/Inkling-2-Mini
      timeouts:
        request: 180s
        backendRequest: 180s
      backendRefs:
        - name: inkling-modal
---
# Allow >=180s for Modal scale-from-zero cold starts (~85s cached).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: agent-router-timeouts
  namespace: ai-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agent-router
  timeout:
    tcp:
      connectTimeout: 10s
    http:
      requestTimeout: 180s
      connectionIdleTimeout: 30s
  connection:
    bufferLimit: 32Mi
  requestBuffer:
    limit: 32Mi
    mode: BufferAndLimit
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: agent-router-client-buffers
  namespace: ai-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agent-router
  connection:
    bufferLimit: 32Mi
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: agent-router-inbound-auth
  namespace: ai-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agent-router
  apiKeyAuth:
    credentialRefs:
      - group: ""
        kind: Secret
        name: agent-router-clients
    extractFrom:
      - headers:
          - Authorization
    forwardClientIDHeader: x-client-id
    sanitize: true
