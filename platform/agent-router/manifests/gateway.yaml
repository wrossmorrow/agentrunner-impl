apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: agent-router
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: agent-router-proxy
  namespace: ai-gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
        name: agent-router
      envoyDeployment:
        container:
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
  telemetry:
    accessLog:
      settings:
        - sinks:
            - type: File
              file:
                path: /dev/stdout
          format:
            type: JSON
            json:
              start_time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              duration_ms: "%DURATION%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              upstream_host: "%UPSTREAM_HOST%"
              upstream_protocol: "%UPSTREAM_PROTOCOL%"
              upstream_transport_failure: "%UPSTREAM_TRANSPORT_FAILURE_REASON%"
              github_repo: "%REQ(X-GITHUB-REPO)%"
              github_run_id: "%REQ(X-GITHUB-RUN-ID)%"
              github_pr: "%REQ(X-GITHUB-PR)%"
              client_id: "%REQ(X-CLIENT-ID)%"
              ai_gateway_metadata: "%METADATA(DYNAMIC:io.envoy.ai_gateway)%"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agent-router
  namespace: ai-gateway
spec:
  gatewayClassName: agent-router
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: agent-router-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same
